# Monthly grouped updates, opened against dev.
version: 2
updates:
  - package-ecosystem: npm
    directory: /common/core
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 has no JS API yet; ts-node and typescript-eslint need it.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: npm
    directory: /api
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 has no JS API yet; ts-node and typescript-eslint need it.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: npm
    directory: /web-sockets
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 has no JS API yet; ts-node and typescript-eslint need it.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: npm
    directory: /infrastructure-as-code
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 has no JS API yet; ts-node and typescript-eslint need it.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: npm
    directory: /app
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 has no JS API yet; ts-node and typescript-eslint need it.
      - dependency-name: typescript
        versions: [">=7"]
      # Versions after these moved to the commercial PrimeUI License.
      - dependency-name: primevue
        versions: [">=5"]
      - dependency-name: "@primeuix/themes"
        versions: [">=3"]
      - dependency-name: primeicons
        versions: [">=8"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
