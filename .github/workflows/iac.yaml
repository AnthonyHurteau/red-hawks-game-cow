name: Infrastructure as Code - Red Hawks Game Cow
run-name: "iac - Env: @${{ github.ref_name }} - @${{ github.actor }}"

on:
  push:
    branches:
      - dev
      - prod
    paths:
      - .github/workflows/iac.yaml
      - api/**
      - common/core/**
      - web-sockets/**
      - infrastructure-as-code/**
  workflow_dispatch:

permissions: {}

env:
  WORKING_DIR: ./infrastructure-as-code
  FUNCTIONS_DEPENDENCY_DIR: ./common/core
  AWS_REGION: us-east-1
  AWS_ACCOUNT: ${{ secrets.AWS_ACCOUNT }}
  ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
  ENVIRONMENT: ${{ github.ref_name }}
  REGION: usea1
  PRODUCT: rhgc

jobs:
  aws-cdk:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # One deploy per branch at a time; queue instead of cancelling a running deploy.
    concurrency:
      group: iac-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: ${{ env.WORKING_DIR }}/pnpm-lock.yaml

      - name: Install AWS CDK & esbuild globally
        shell: bash
        run: pnpm add -g aws-cdk@2.1146.1 esbuild@0.28.2

      - name: Install AWS CDK dependencies
        working-directory: ${{ env.WORKING_DIR }}
        shell: bash
        run: pnpm install --frozen-lockfile --prod

      - name: Install Functions dependencies
        working-directory: ${{ env.FUNCTIONS_DEPENDENCY_DIR }}
        shell: bash
        run: pnpm install --frozen-lockfile --prod

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}

      - name: Deploy Infrastructure as Code
        working-directory: ${{ env.WORKING_DIR }}
        shell: bash
        run: cdk deploy --all --require-approval never
