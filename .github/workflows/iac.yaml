name: Infrastructure as Code - Red Hawks Game Cow
run-name: "iac - Env: @${{ github.ref_name }} - @${{ github.actor }}"

on:
  push:
    branches:
      - dev
      - prod
    paths:
      - .github/workflows/iac.yaml
      - api/**
      - common/core/**
      - web-sockets/**
      - infrastructure-as-code/**
  workflow_dispatch:

permissions: {}

env:
  WORKING_DIR: ./infrastructure-as-code
  FUNCTIONS_DEPENDENCY_DIR: ./common/core
  AWS_REGION: us-east-1
  AWS_ACCOUNT: ${{ secrets.AWS_ACCOUNT }}
  ENVIRONMENT: ${{ github.ref_name }}
  REGION: usea1
  PRODUCT: rhgc

jobs:
  aws-cdk:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # One deploy per branch at a time; queue instead of cancelling a running deploy.
    concurrency:
      group: iac-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: ${{ env.WORKING_DIR }}/pnpm-lock.yaml

      - name: Install AWS CDK & esbuild globally
        shell: bash
        run: pnpm add -g aws-cdk@2.1146.1 esbuild@0.28.2

      - name: Install AWS CDK dependencies
        working-directory: ${{ env.WORKING_DIR }}
        shell: bash
        run: pnpm install --frozen-lockfile --prod

      - name: Install Functions dependencies
        working-directory: ${{ env.FUNCTIONS_DEPENDENCY_DIR }}
        shell: bash
        run: pnpm install --frozen-lockfile --prod

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}

      - name: Deploy Infrastructure as Code
        working-directory: ${{ env.WORKING_DIR }}
        shell: bash
        run: cdk deploy --all --require-approval never
